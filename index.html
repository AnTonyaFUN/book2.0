<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Моя Электронная Библиотека</title>
    <style>
        /* --- БАЗОВЫЕ СТИЛИ --- */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; color: #333; margin: 0; padding: 0; min-height: 100vh; }
        header { width: 100%; background-color: #2c3e50; color: white; text-align: center; padding: 1rem 0; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 2rem; }
        
        /* Сетка библиотеки */
        .library-grid { display: flex; gap: 30px; flex-wrap: wrap; justify-content: center; max-width: 1000px; padding: 20px; margin: 0 auto; }
        .book-card { width: 160px; height: 240px; background: #fff; border-radius: 5px; box-shadow: 0 10px 20px rgba(0,0,0,0.2); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; cursor: pointer; transition: transform 0.3s; border-left: 8px solid #8e44ad; padding: 10px;}
        .book-card:hover { transform: translateY(-10px); }
        .book-card h2 { font-size: 16px; margin-bottom: 5px; }
        
        /* --- ПОЛНОЭКРАННАЯ ЧИТАЛКА --- */
        body.reading { overflow: hidden; }

        .book-container { 
            display: none; 
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; 
            background: #222; 
            z-index: 1000; 
            justify-content: center; align-items: center; 
            overflow: hidden; 
        }

        .close-btn {
            position: absolute; top: 20px; right: 20px;
            background: rgba(255,255,255,0.2); color: white; border: none;
            width: 40px; height: 40px; border-radius: 50%;
            font-size: 20px; cursor: pointer; z-index: 1005;
            transition: background 0.3s;
        }
        .close-btn:hover { background: rgba(255,255,255,0.4); }

        .tap-zone { position: absolute; top: 0; bottom: 0; z-index: 1001; cursor: pointer; }
        .tap-left { left: 0; width: 40%; }
        .tap-right { right: 0; width: 60%; }

        .book { position: relative; transform-style: preserve-3d; perspective: 3000px; }
        .page { position: absolute; top: 0; height: 100%; transform-style: preserve-3d; transition: transform 0.7s cubic-bezier(0.645, 0.045, 0.355, 1); transform-origin: left center; }
        .front, .back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; background-color: #fffaf0; padding: 40px; box-sizing: border-box; display: flex; flex-direction: column; box-shadow: inset 0 0 20px rgba(0,0,0,0.05); }
        
        .page-text { text-align: left; line-height: 1.6; flex-grow: 1; overflow: hidden; font-size: 14px; white-space: pre-wrap; }
        .page-number { text-align: center; font-size: 12px; color: #888; margin-top: 15px; }
        .cover .front { background-color: #8e44ad; color: white; justify-content: center; align-items: center; text-align: center; }

        /* =========================================
           АДАПТАЦИЯ ДЛЯ ТЕЛЕФОНОВ
           ========================================= */
        @media (max-width: 767px) {
            .book { width: 90vw; height: 85vh; }
            .page { width: 100%; left: 0; }
            .front { padding: 25px; } /* На телефоне отступы по краям делаем поменьше */
            .back { display: none; } 
            .front { border-radius: 5px; border: 1px solid #ccc; box-shadow: 2px 2px 10px rgba(0,0,0,0.3); }
            .flipped { transform: rotateY(-180deg); opacity: 0; pointer-events: none;}
            .tap-left { width: 30%; } .tap-right { width: 70%; } 
        }

        /* =========================================
           АДАПТАЦИЯ ДЛЯ ПК (Широкий формат)
           ========================================= */
        @media (min-width: 768px) {
            /* УВЕЛИЧЕННАЯ ШИРИНА: теперь максимум 1400px (было 900) */
            .book { width: 90vw; max-width: 1400px; height: 88vh; }
            .page { width: 50%; left: 50%; }
            .front { border-radius: 0 10px 10px 0; border: 1px solid #ccc; border-left: 1px solid #ddd; }
            .back { transform: rotateY(180deg); border-radius: 10px 0 0 10px; border: 1px solid #ccc; border-right: 1px solid #ddd; display: flex; }
            .flipped { transform: rotateY(-180deg); }
            .tap-left { width: 50%; } .tap-right { width: 50%; }
            /* Чуть увеличили шрифт и межстрочный интервал для больших мониторов */
            .page-text { font-size: 16px; line-height: 1.7; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Моя Электронная Библиотека</h1>
    </header>

    <div id="libraryGrid" class="library-grid">
        <div class="book-card" onclick="openBook()">
            <h2>Пикми-Тян</h2>
            <small>Фантастика / Абсурд</small>
        </div>
    </div>

    <div id="bookContainer" class="book-container">
        <button class="close-btn" onclick="closeBook()">✕</button>
        <div class="tap-zone tap-left" onclick="prevPage()"></div>
        <div class="tap-zone tap-right" onclick="nextPage()"></div>
        <div id="dynamicBook" class="book"></div>
    </div>

    <script>
        const dynamicBook = document.getElementById('dynamicBook');
        let myBookText = ""; 
        let pagesElements = [];
        let currentPageIndex = 0; 

        async function loadBookFromFile() {
            try {
                const response = await fetch('book.txt'); 
                if (!response.ok) throw new Error('Файл не найден');
                myBookText = await response.text(); 
            } catch (error) {
                console.error(error);
                myBookText = "Ошибка загрузки. Проверьте наличие файла book.txt.";
            }
        }

        function buildBook() {
            dynamicBook.innerHTML = ''; 
            let pagesData = [];
            let currentIndex = 0;
            
            const isMobile = window.innerWidth < 768;
            
            // ВАЖНО: Увеличили вместимость текста для ПК с 750 до 1400 символов, 
            // так как физическая площадь страницы стала намного больше.
            const charsPerPage = isMobile ? 450 : 1400; 

            while (currentIndex < myBookText.length) {
                let chunk = myBookText.substr(currentIndex, charsPerPage);
                let lastSpace = Math.max(chunk.lastIndexOf(' '), chunk.lastIndexOf('\n'));
                
                if (lastSpace > 0 && currentIndex + charsPerPage < myBookText.length) {
                    chunk = chunk.substr(0, lastSpace);
                    currentIndex += lastSpace + 1;
                } else {
                    currentIndex += charsPerPage;
                }
                pagesData.push(chunk.trimStart());
            }

            let htmlContent = '';

            if (isMobile) {
                htmlContent += `
                <div class="page cover">
                    <div class="front">
                        <h2>Пикми-Тян</h2><p>Тапните справа,<br>чтобы начать</p>
                    </div><div class="back"></div>
                </div>`;
                for (let i = 0; i < pagesData.length; i++) {
                    htmlContent += `
                    <div class="page">
                        <div class="front">
                            <div class="page-text">${pagesData[i]}</div>
                            <div class="page-number">${i + 1}</div>
                        </div><div class="back"></div>
                    </div>`;
                }
            } else {
                htmlContent += `
                <div class="page cover">
                    <div class="front">
                        <h2>Пикми-Тян</h2><p>Кликните справа для чтения</p>
                    </div>
                    <div class="back">
                        <div class="page-text">${pagesData[0] || ''}</div>
                        <div class="page-number">1</div>
                    </div>
                </div>`;
                for (let i = 1; i < pagesData.length; i += 2) {
                    htmlContent += `
                    <div class="page">
                        <div class="front">
                            <div class="page-text">${pagesData[i] || ''}</div>
                            <div class="page-number">${i + 1}</div>
                        </div>
                        <div class="back">
                            <div class="page-text">${pagesData[i + 1] || ''}</div>
                            <div class="page-number">${i + 2}</div>
                        </div>
                    </div>`;
                }
            }

            dynamicBook.innerHTML = htmlContent;
            pagesElements = document.querySelectorAll('.page');
            updateZIndexes(); 
        }

        function nextPage() {
            if (currentPageIndex < pagesElements.length) {
                pagesElements[currentPageIndex].classList.add('flipped');
                currentPageIndex++;
                setTimeout(updateZIndexes, 350); 
            }
        }

        function prevPage() {
            if (currentPageIndex > 0) {
                currentPageIndex--;
                pagesElements[currentPageIndex].classList.remove('flipped');
                setTimeout(updateZIndexes, 350);
            }
        }

        function updateZIndexes() {
            pagesElements.forEach((page, i) => {
                if (i < currentPageIndex) {
                    page.style.zIndex = i + 1;
                } else {
                    page.style.zIndex = pagesElements.length - i;
                }
            });
        }

        async function openBook() {
            await loadBookFromFile(); 
            buildBook(); 
            currentPageIndex = 0; 
            document.body.classList.add('reading'); 
            document.getElementById('bookContainer').style.display = 'flex';
        }

        function closeBook() {
            document.body.classList.remove('reading');
            document.getElementById('bookContainer').style.display = 'none';
        }

        window.addEventListener('resize', () => {
            if (document.getElementById('bookContainer').style.display === 'flex') {
                buildBook();
                currentPageIndex = 0;
            }
        });
    </script>
</body>
</html>
